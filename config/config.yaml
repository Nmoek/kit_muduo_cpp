system:
  business:
    max_task_queue: 2147483647
    max_threads: 100
    submit_timeout_ms: 300
    thread_idle_seconds: 30
  http:
    host: 0.0.0.0
    io_threads: 4
    port: 5555
    static_root_path: web
  log:
    max_record_bytes: 262144
    async:
      queue_capacity: 8192
      max_queue_bytes: 16777216
      stop_drain_timeout_ms: 3000
    file:
      flush_threshold: 1048576
      flush_interval_ms: 3000
      flush_on_level: ERROR
      rotate_max_bytes: 314572800
      rotate_max_backup_files: 5
      compress_rotated: true
      init_failure_policy: fail
    loggers:
      - name: root
        level: DEBUG
        appenders:
          - type: stdout
            level: DEBUG
        formatter: "[%d][%le][%f #%l][%gn.%mn]<%pid:%tn> %m"
      - name: base
        level: DEBUG
        appenders:
          - type: stdout
            level: WARN
          - type: file
            level: DEBUG
            file_path: log/base.log
        formatter: "[%d][%le][%f #%l][%gn.%mn]<%pid:%tn> %m"
      - name: net
        level: DEBUG
        appenders:
          - type: stdout
            level: WARN
          - type: file
            level: DEBUG
            file_path: log/net.log
        formatter: "[%d][%le][%f #%l][%gn.%mn]<%pid:%tn> %m"
      - name: web
        level: DEBUG
        appenders:
          - type: stdout
            level: DEBUG
          - type: file
            level: DEBUG
            file_path: log/web.log
        formatter: "[%d][%le][%f #%l][%gn.%mn]<%pid:%tn> %m"
      - name: domain
        level: DEBUG
        appenders:
          - type: stdout
            level: DEBUG
          - type: file
            level: DEBUG
            file_path: log/domain.log
        formatter: "[%d][%le][%f #%l][%gn.%mn]<%pid:%tn> %m"
  sqlite_db:
    busy_timeout_ms: 3000
    path: kit.sqlite
    pool_capacity: 20
    sync_schema: true
    synchronous: 1
work:
  interaction:
    capture_max_binary_attachment_bytes: 5242880
    capture_max_hex_bytes: 65536
    capture_max_text_bytes: 65536
    queue_capacity: 4096
    stop_drain_timeout_ms: 1000
  runtime:
    loop_capacity: 100