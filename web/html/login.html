<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用安检机协议半自动测试平台</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">
                <span class="login-title-text">通用安检机协议半自动测试平台</span>
                <span class="login-version-badge" id="loginVersionBadge">Beta</span>
            </h1>
        </div>
        <div class="login-box">
            <button type="button" id="loginModeSwitch" class="login-mode-switch" aria-pressed="false" aria-label="切换为管理员登录">
                <span class="login-mode-switch-text">切换管理员登录</span>
            </button>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="note">note</label>
                    <input type="text" id="note" name="note" autocomplete="username" maxlength="32" placeholder="请输入 3-32 位英文字母或数字" required>
                </div>
                <div class="form-group admin-password-group" id="adminPasswordGroup" hidden>
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="请输入管理员密码">
                </div>
                <div id="loginError" class="login-error" aria-live="polite"></div>
                <button type="submit" id="loginSubmit">登录</button>
            </form>
        </div>
    </div>
    <script src="../js/namespace.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/mock_data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
